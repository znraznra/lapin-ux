[package]
name = "lapin-ux-shell"
description = "Lapin UX taskbar and Start menu"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "lapin-ux-shell"
path = "src/main.rs"

[dependencies]
mime_guess = "2.0.5"
lapin-ux-core.workspace = true
anyhow.workspace = true
chrono.workspace = true
futures.workspace = true
jiff = "0.2"
serde.workspace = true
libcosmic.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zbus.workspace = true
# Clipboard history and typing emoji (their own Wayland connection).
wayland-client = "0.31"
# Client code for our own compositor protocol (protocols/lapin-shell-v1.xml).
wayland-scanner = "0.31"
wayland-backend = "0.3"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
libc = "0.2"
emojis = "0.6"
