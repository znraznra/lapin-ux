[package]
name = "lapin-ux-notes"
description = "Lapin UX Notes: a text and code editor"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libcosmic = { workspace = true, features = ["xdg-portal"] }
lapin-ux-core.workspace = true
lapin-ux-ui.workspace = true
anyhow.workspace = true
dirs.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Text handling: encodings, search, syntax colours. All local, no network.
encoding_rs = "0.8"
chardetng = "1"
regex = "1"
unicode-width = "0.2"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy", "parsing"] }
