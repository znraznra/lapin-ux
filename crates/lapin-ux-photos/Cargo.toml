[package]
name = "lapin-ux-photos"
description = "Lapin UX Photos: an offline gallery and image viewer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# File dialog for Add folder (XDG portal, which Lapin UX answers with its own file dialog).
libcosmic = { workspace = true, features = ["xdg-portal"] }
lapin-ux-core.workspace = true
lapin-ux-ui.workspace = true
anyhow.workspace = true
chrono.workspace = true
dirs.workspace = true
futures.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Already in the tree through libcosmic; reads the photo's rotation (EXIF).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
# The Hidden vault: files are encrypted with ChaCha20-Poly1305, and the key is wrapped by a key made from the password with Argon2id.
chacha20poly1305 = "0.10"
argon2 = "0.5"
