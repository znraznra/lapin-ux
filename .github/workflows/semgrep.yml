name: Semgrep

# Reports to the Security tab only. Not blocking until the first findings are triaged.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.97.0
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        run: semgrep scan --config p/default --config p/secrets --sarif --output semgrep.sarif --metrics=off .
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && github.event.pull_request.head.repo.fork != true
        with:
          sarif_file: semgrep.sarif
          category: semgrep
