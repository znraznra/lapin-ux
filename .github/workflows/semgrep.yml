name: Semgrep

# Reports to the Security tab only. Not blocking until the first findings are triaged.
# CodeQL is not a workflow here: the repository's default setup already runs it (actions, python, rust),
# and GitHub rejects advanced-workflow CodeQL uploads while the default setup is on.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.97.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scan
        run: semgrep scan --config p/default --config p/secrets --sarif --output semgrep.sarif --metrics=off .
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        if: always() && github.event.pull_request.head.repo.fork != true
        with:
          sarif_file: semgrep.sarif
          category: semgrep
