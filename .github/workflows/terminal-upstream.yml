name: Terminal upstream watch

# Checks that Lapin Terminal's patches still apply to the newest Alacritty release.
# Reports only: it opens an issue when they do not, and never pushes or changes the repository.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  patches-apply:
    name: Patches on the latest Alacritty release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Find the latest release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/alacritty/alacritty/releases/latest --jq .tag_name)
          [ -n "$tag" ] || { echo "could not read the latest release" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Apply the patches
        id: apply
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          git clone --quiet --depth 1 --branch "$TAG" https://github.com/alacritty/alacritty.git "$RUNNER_TEMP/alacritty"
          cd "$RUNNER_TEMP/alacritty"
          for p in "$GITHUB_WORKSPACE"/packaging/lapin-ux-terminal/*.patch; do git apply --check "$p" && git apply "$p"; done
      - name: Open an issue when they do not apply
        if: failure() && steps.apply.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --title "Terminal: patches no longer apply to Alacritty $TAG" \
            --body "The weekly check could not apply packaging/lapin-ux-terminal to $TAG. Rebase the patches on that release and update the pin in packaging/arch-terminal/PKGBUILD. Run: $RUN_URL"
