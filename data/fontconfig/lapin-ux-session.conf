<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Font setup for the Lapin UX session only. start-lapin-ux points
  FONTCONFIG_FILE here: the system's usual setup, then Lapin UX's rule that
  makes Selawik the interface font and Lapin Fluent Emoji the emoji font.
  Other desktops never read this file, so their fonts don't change.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <include ignore_missing="yes">/usr/share/fontconfig/conf.avail/50-lapin-ux-selawik.conf</include>
</fontconfig>
