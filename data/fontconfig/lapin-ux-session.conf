<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Font setup for the Lapin UX session only. start-lapin-ux points
  FONTCONFIG_FILE here: the system's usual setup, then Lapin UX's rule that
  makes Selawik the interface font and Lapin Fluent Emoji the emoji font.
  Other desktops never read this file, so their fonts don't change.
-->
<fontconfig>
  <!--
    Text smoothing (#40): subpixel smoothing in RGB order with slight
    hinting, the usual setting for LCD screens, for Qt, Firefox, Electron
    and other fontconfig apps. Set before the system's setup, so a choice
    already made there (yours or the distribution's) still wins.
  -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <include ignore_missing="yes">/usr/share/fontconfig/conf.avail/50-lapin-ux-selawik.conf</include>
  <!--
    What you pick in Settings > Personalization > Fonts, last so it wins.
    Written by Settings to ~/.config/lapin-ux/fonts.conf.
  -->
  <include ignore_missing="yes" prefix="xdg">lapin-ux/fonts.conf</include>
</fontconfig>
