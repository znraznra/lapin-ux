<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Lapin UX: one system font. Selawik (OFL-1.1) is the font for interface
  text everywhere: the generic sans-serif, serif and system-ui families, and
  the interface fonts other desktops and distributions default to.
  Monospace (terminals, code) is left alone: Selawik has no fixed-width style.
  Emoji come from Lapin Fluent Emoji (Microsoft's Fluent Emoji artwork, MIT),
  whatever emoji font an app asks for.
  Characters Selawik doesn't have (CJK, emoji, other scripts) still fall back
  to other installed fonts, as fontconfig always does.
-->
<fontconfig>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Selawik</family><family>Lapin Fluent Emoji</family></prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>Selawik</family><family>Lapin Fluent Emoji</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Selawik</family><family>Lapin Fluent Emoji</family></prefer>
  </alias>
  <alias binding="strong">
    <family>ui-sans-serif</family>
    <prefer><family>Selawik</family><family>Lapin Fluent Emoji</family></prefer>
  </alias>

  <!-- Interface fonts other desktops and distributions set by default. -->
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true"><string>Inter</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Selawik</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true"><string>Inter Variable</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Selawik</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true"><string>Cantarell</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Selawik</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true"><string>Adwaita Sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Selawik</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true"><string>Noto Sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Selawik</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true"><string>Noto Sans UI</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Selawik</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true"><string>DejaVu Sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Selawik</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true"><string>Open Sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Selawik</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true"><string>Fira Sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Selawik</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true"><string>Ubuntu</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Selawik</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true"><string>Roboto</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Selawik</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true"><string>Segoe UI</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Selawik</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true"><string>Segoe UI Variable</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Selawik</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true"><string>Segoe UI Variable Text</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Selawik</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true"><string>Segoe UI Variable Display</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Selawik</string></edit>
  </match>

  <!-- Emoji: Fluent Emoji only. -->
  <alias binding="strong">
    <family>emoji</family>
    <prefer><family>Lapin Fluent Emoji</family></prefer>
  </alias>
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true"><string>Noto Color Emoji</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Lapin Fluent Emoji</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true"><string>Apple Color Emoji</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Lapin Fluent Emoji</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true"><string>Segoe UI Emoji</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Lapin Fluent Emoji</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true"><string>Segoe UI Symbol</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Lapin Fluent Emoji</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true"><string>Twemoji</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Lapin Fluent Emoji</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true"><string>Twitter Color Emoji</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Lapin Fluent Emoji</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true"><string>EmojiOne Color</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Lapin Fluent Emoji</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true"><string>JoyPixels</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Lapin Fluent Emoji</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true"><string>Blobmoji</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Lapin Fluent Emoji</string></edit>
  </match>
</fontconfig>
